---
name: Build and deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*.*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CVs
        run: |
          make

      - name: Upload CVs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            outputs/english_cv.pdf
            outputs/french_cv.pdf
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build

    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download CVs artifacts
        uses: actions/download-artifact@v4
        with:
          name: cv-pdfs
          path: outputs

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            outputs/english_cv.pdf
            outputs/french_cv.pdf
          fail_on_unmatched_files: true
