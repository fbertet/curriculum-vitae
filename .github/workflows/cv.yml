---
name: Build and deploy

on:
  push:
    branches:
      - main
    tags:
      - "v*.*"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build CVs
        run: |
          make

      - name: Upload CVs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdfs
          path: |
            outputs/english_cv.pdf
            outputs/french_cv.pdf
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build

    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download CVs artifacts
        uses: actions/download-artifact@v4
        with:
          name: cv-pdfs
          path: outputs

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: CV ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload English CV
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: outputs/english_cv.pdf
          asset_name: cv_en.pdf
          asset_content_type: application/pdf

      - name: Upload French CV
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: outputs/french_cv.pdf
          asset_name: cv_fr.pdf
          asset_content_type: application/pdf
